[pytest]
# `python -m pytest` puts the working directory on sys.path, but the bare `pytest`
# console script does not.  That difference is invisible locally (where the suite was
# always run as `python -m pytest`) and fatal in CI, which failed with
# "ImportError while loading conftest: No module named 'src'".  Declaring the
# repository root here makes every invocation - from any working directory - resolve
# `src.*` the same way.
pythonpath = .
testpaths = tests
